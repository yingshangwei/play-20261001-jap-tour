name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      - name: Prepare Pages artifact
        shell: bash
        run: |
          exported_index="$(find dist/client -type f -name index.html -print -quit)"
          if [ -z "$exported_index" ]; then
            echo "No static index.html was generated"
            find dist/client -maxdepth 4 -type f -print
            exit 1
          fi
          if [ "$exported_index" != "dist/client/index.html" ]; then
            cp "$exported_index" dist/client/index.html
          fi

          repository_name="${GITHUB_REPOSITORY#*/}"
          nested_assets="dist/client/${repository_name}/_next"
          if [ -d "$nested_assets" ]; then
            cp -R "$nested_assets" dist/client/_next
          fi
          if [ ! -d "dist/client/_next" ]; then
            echo "No client _next assets were generated"
            find dist/client -maxdepth 4 -type d -print
            exit 1
          fi

          touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
